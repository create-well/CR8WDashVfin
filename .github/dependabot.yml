version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep both bare and npm:-prefixed names because security alerts have
      # surfaced with both identifier styles across Dependabot runs.
      - dependency-name: esbuild
        versions: ['<0.28.1']
      - dependency-name: npm:esbuild
        versions: ['<0.28.1']
      - dependency-name: undici
        versions: ['<6.28.0', '>=7.0.0 <7.29.0', '>=8.0.0 <8.9.0']
      - dependency-name: npm:undici
        versions: ['<6.28.0', '>=7.0.0 <7.29.0', '>=8.0.0 <8.9.0']
      - dependency-name: path-to-regexp
        versions: ['<0.1.13', '>=0.2.0 <1.9.0', '>=2.0.0 <3.3.0', '>=4.0.0 <6.3.0', '>=7.0.0 <8.4.3']
      - dependency-name: npm:path-to-regexp
        versions: ['<0.1.13', '>=0.2.0 <1.9.0', '>=2.0.0 <3.3.0', '>=4.0.0 <6.3.0', '>=7.0.0 <8.4.3']
