name: THS Git to Notion sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write repository metadata into Notion'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: notion-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API client
        run: python -m pip install --disable-pip-version-check requests

      - name: Dry-run synchronization
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tools/notion-sync/sync_notion_ths.py --root .

      - name: Apply synchronization
        if: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tools/notion-sync/sync_notion_ths.py --root . --apply
