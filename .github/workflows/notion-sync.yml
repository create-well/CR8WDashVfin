name: THS Git to Notion sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write repository metadata into Notion'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production
    # The existing Production secret is named NOTION_CR8WDASHBOARD_KEY;
    # expose it to the scripts under their stable runtime variable name.
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_CR8WDASHBOARD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API client
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify Notion secret is available
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_CR8WDASHBOARD_KEY is missing from the Production environment; refusing to sync."
            exit 1
          fi
      - name: Dry-run synchronization
        run: python tools/notion-sync/sync_notion_ths.py --root .
      - name: Apply synchronization
        if: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        run: python tools/notion-sync/sync_notion_ths.py --root . --apply
      - name: Check live Notion metadata drift
        run: python tools/notion-sync/notion_drift_check.py --root . --output notion-drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-drift-report-${{ github.run_id }}
          path: notion-drift-report.json
          if-no-files-found: ignore
