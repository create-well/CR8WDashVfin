name: Production dashboard smoke test

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/production-dashboard-integration.mjs'
      - 'package.json'
      - '.github/workflows/production-smoke.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-dashboard-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Production API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Production dashboard smoke test
        env:
          CR8W_PROD_API_URL: https://cr8w-dash-vfin.vercel.app/api/server
          CR8W_PROD_PUBLIC_KEY: ${{ secrets.CR8W_PROD_PUBLIC_KEY }}
        run: npm run test:production
