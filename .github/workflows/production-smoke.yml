name: Production dashboard smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: production-dashboard-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run production checks
        run: node tests/production-dashboard-integration.mjs
        env:
          CR8W_PROD_BASE_URL: https://www.cr8w.com
