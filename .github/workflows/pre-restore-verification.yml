name: Pre-restore backup verification

on:
  workflow_call:
    inputs:
      backup_artifact:
        description: 'Artifact name containing manifest.json and backups/'
        required: true
        type: string
      backup_root:
        description: 'Root directory inside the downloaded artifact'
        required: false
        default: '.'
        type: string
    outputs:
      verified:
        description: 'Whether the backup verification passed'
        value: ${{ jobs.verify.outputs.verified }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify backup before restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download approved backup artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.backup_artifact }}
          path: .restore-input

      - name: Run mandatory read-only verification gate
        id: verify
        env:
          BACKUP_ROOT: ${{ inputs.backup_root }}
        run: |
          set -euo pipefail
          ROOT=".restore-input/${BACKUP_ROOT#./}"
          pnpm --silent verify:backup --root "$ROOT" --manifest "$ROOT/manifest.json" --backup-directory backups --json | tee verification.json
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-verification-${{ github.run_id }}
          path: verification.json
          if-no-files-found: warn
          retention-days: 30
