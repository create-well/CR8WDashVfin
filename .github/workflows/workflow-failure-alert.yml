name: Workflow failure alert

on:
  workflow_run:
    workflows:
      - THS metadata drift check
      - THS Git to Notion sync
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: workflow-failure-alert-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update deduplicated failure issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'workflow-failure';
            const issueTitle = `Workflow failure: ${run.name}`;
            const runUrl = run.html_url;
            const branch = run.head_branch || '(unknown branch)';
            const sha = run.head_sha || '(unknown commit)';
            const actor = run.actor?.login || '(unknown actor)';
            const occurred = run.updated_at || run.created_at;
            const body = [
              `## ${run.name} failed`,
              '',
              `- **Run:** [Open failed run](${runUrl})`,
              `- **Branch:** \`${branch}\``,
              `- **Commit:** \`${sha}\``,
              `- **Actor:** @${actor}`,
              `- **Updated:** ${occurred}`,
              '',
              'The alert is generated by GitHub Actions. Review the failed run and close this issue after the root cause is resolved and a subsequent run passes.'
            ].join('\n');

            let label;
            try {
              label = await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) throw error;
              label = await github.rest.issues.createLabel({
                owner, repo, name: labelName, color: 'B60205', description: 'Automated workflow failure alert'
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: labelName, per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === issueTitle && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated existing alert issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: issueTitle, body, labels: [labelName]
              });
              core.info(`Created alert issue #${created.data.number}`);
            }
